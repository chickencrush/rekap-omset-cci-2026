<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Omset CCI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #fafaf9; --surface: #ffffff; --text-primary: #1c1917;
            --text-secondary: #57534e; --text-muted: #a8a29e; --border: #e7e5e4;
            --status-ok: #16a34a; --status-stale: #d97706; --status-error: #dc2626;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        html { font-size: 16px; }
        body { font-family: var(--font); background: var(--bg); color: var(--text-primary); line-height: 1.5; min-height: 100vh; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 0.5rem; }
        .dashboard-header h1 { font-size: 1.125rem; font-weight: 600; letter-spacing: -0.01em; }
        .header-meta { display: flex; align-items: center; gap: 0.75rem; }
        .status-pill { display: inline-flex; align-items: center; padding: 0.25rem 0.625rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; white-space: nowrap; }
        .status-loading { background: #f5f5f4; color: var(--text-secondary); }
        .status-ok { background: #f0fdf4; color: var(--status-ok); }
        .status-stale { background: #fffbeb; color: var(--status-stale); }
        .status-error { background: #fef2f2; color: var(--status-error); }
        #refresh-btn { font-family: var(--font); font-size: 0.75rem; font-weight: 500; padding: 0.375rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text-primary); cursor: pointer; }
        #refresh-btn:hover { background: #f5f5f4; }
        #refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading-state { display: flex; justify-content: center; align-items: center; min-height: 60vh; font-size: 0.875rem; color: var(--text-secondary); }
        .dashboard-content { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; padding: 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
        .filter-group { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); }
        .filter-group select { font-family: var(--font); font-size: 0.8125rem; padding: 0.375rem 0.5rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text-primary); min-width: 140px; }
        .hero-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; display: flex; flex-direction: column; gap: 0.25rem; }
        .metric-label { font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }
        .metric-value { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary); }
        .metric-duo { font-size: 1.125rem; }
        .metric-sub { font-size: 0.75rem; color: var(--text-muted); }
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .chart-wide { grid-column: 1 / -1; }
        .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; position: relative; }
        .chart-card h3 { font-size: 0.8125rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--text-primary); }
        .chart-card h3 small { font-weight: 400; color: var(--text-muted); font-size: 0.6875rem; }
        .chart-card canvas { width: 100% !important; height: 280px !important; }
        .empty-state { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; font-size: 0.8125rem; color: var(--text-muted); background: var(--surface); border-radius: 8px; }
        @media (max-width: 768px) { .chart-grid { grid-template-columns: 1fr; } .dashboard-content { padding: 1rem; } .hero-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 480px) { .hero-grid { grid-template-columns: 1fr; } .filter-bar { flex-direction: column; } }
    </style>
</head>
<body>
    <header class="dashboard-header">
        <h1>Rekap Omset CCI</h1>
        <div class="header-meta">
            <span id="last-updated" class="status-pill status-loading">Memuat data…</span>
            <button id="refresh-btn" type="button">Refresh</button>
        </div>
    </header>
    <section id="loading-state" class="loading-state">Memuat data…</section>
    <main id="dashboard-content" class="dashboard-content" hidden>
        <div class="filter-bar">
            <label class="filter-group"><span>Periode</span><select id="filter-month"><option value="">Semua bulan</option></select></label>
            <label class="filter-group"><span>Jenis Outlet</span><select id="filter-jenis"><option value="ALL">Semua</option><option value="PUSAT">Pusat</option><option value="MITRA">Mitra</option></select></label>
            <label class="filter-group"><span>Outlet</span><select id="filter-outlet" multiple size="1"></select></label>
        </div>
        <div class="hero-grid">
            <div class="metric-card"><span class="metric-label">Total Omset</span><span class="metric-value" id="hero-total">–</span><span class="metric-sub" id="hero-total-sub"></span></div>
            <div class="metric-card"><span class="metric-label">Outlet Aktif</span><span class="metric-value" id="hero-outlets">–</span><span class="metric-sub" id="hero-outlets-sub"></span></div>
            <div class="metric-card"><span class="metric-label">Offline vs Online</span><span class="metric-value" id="hero-channel">–</span><span class="metric-sub" id="hero-channel-sub"></span></div>
            <div class="metric-card"><span class="metric-label">Terbaik / Terendah</span><span class="metric-value metric-duo" id="hero-rank">–</span><span class="metric-sub" id="hero-rank-sub"></span></div>
        </div>
        <div class="chart-grid">
            <div class="chart-card chart-wide"><h3>Tren Omset Harian <small>Rp · <span id="chart-tren-period"></span></small></h3><canvas id="chart-tren"></canvas><div id="chart-tren-empty" class="empty-state" hidden>Belum ada data.</div></div>
            <div class="chart-card"><h3>Komposisi Kanal <small>% · <span id="chart-kanal-period"></span></small></h3><canvas id="chart-kanal"></canvas><div id="chart-kanal-empty" class="empty-state" hidden>Belum ada data.</div></div>
            <div class="chart-card"><h3>Ranking Outlet <small>Top 10 · <span id="chart-ranking-period"></span></small></h3><canvas id="chart-ranking"></canvas><div id="chart-ranking-empty" class="empty-state" hidden>Belum ada data.</div></div>
        </div>
    </main>
    <script>
    // ============ GANTI URL INI DENGAN URL DEPLOY APPS SCRIPT ANDA ============
    const API_URL = 'https://script.google.com/macros/s/AKfycbzznDhcr6n9BAt0jZrVnfTW5Vbc0-zx_zkHS4vK1lVWYhuCGP17CwsJnbLSskHTGA/exec';
    // ===========================================================================

    const CHANNEL_KEYS = ['DINE IN','TAKE AWAY','ESB ORDER','ESB DELIVERY','GOFOOD','GRABFOOD','SHOPEFOOD'];
    const OFFLINE_CHANNELS = ['DINE IN','TAKE AWAY'];
    const ONLINE_CHANNELS = ['ESB ORDER','ESB DELIVERY','GOFOOD','GRABFOOD','SHOPEFOOD'];
    const REFRESH_INTERVAL_MS = 60000;

    let __lastGoodData = null, __lastFetchTime = null;
    let __charts = {tren:null,kanal:null,ranking:null};
    let __filters = {month:'',jenis:'ALL',outlets:[]};
    let __allOutlets = [], __refreshTimer = null;

    function parseDateISO(s) {
        if (!s) return null;
        const [y,m,d] = s.split('-').map(Number);
        const dt = new Date(Date.UTC(y, m-1, d));
        return isNaN(dt.getTime()) ? null : dt;
    }

    function formatRupiah(v) {
        if (v === null || v === undefined || isNaN(v)) return '–';
        const a = Math.abs(v); let f;
        if (a >= 1e9) f = (v/1e9).toFixed(2)+' M';
        else if (a >= 1e6) f = (v/1e6).toFixed(1)+' jt';
        else if (a >= 1e3) f = (v/1e3).toFixed(0)+' rb';
        else f = v.toFixed(0);
        return `Rp ${f}`;
    }
    function formatDateShort(d) {
        const m = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
        return `${String(d.getUTCDate()).padStart(2,'0')} ${m[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
    }
    function formatMonthKey(d) { return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`; }
    function formatMonthLabel(k) {
        const [y,m] = k.split('-').map(Number);
        const M = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        return `${M[m-1]} ${y}`;
    }
    function formatLocalTime(iso) {
        const d = new Date(iso);
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const short = tz ? tz.split('/').pop().replace(/_/g,' ') : 'lokal';
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')} ${short}`;
    }

    async function fetchFromAPI() {
        const sep = API_URL.includes('?') ? '&' : '?';
        const url = `${API_URL}${sep}t=${Date.now()}`;
        let response;
        try { response = await fetch(url, { cache: 'no-store' }); }
        catch (e) { throw new Error(`Gagal terhubung: ${e.message}`); }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const json = await response.json();
        if (!json.ok) throw new Error(json.error || 'API error');
        return json;
    }

    function transformRecords(json) {
        return json.data.map(r => ({
            tanggal: parseDateISO(r.tanggal),
            outlet: r.outlet,
            jenis: r.jenis,
            channels: r.channels,
            total: r.total
        })).filter(r => r.tanggal !== null);
    }

    function applyFilters(recs) {
        let f = recs;
        if (__filters.month) f = f.filter(r => formatMonthKey(r.tanggal) === __filters.month);
        if (__filters.jenis !== 'ALL') f = f.filter(r => r.jenis === __filters.jenis);
        if (__filters.outlets.length > 0) { const s = new Set(__filters.outlets); f = f.filter(r => s.has(r.outlet)); }
        return f;
    }

    function computeMetrics(recs) {
        if (recs.length === 0) return {total:null,activeOutlets:0,totalOutlets:0,offlinePct:null,onlinePct:null,best:null,worst:null};
        const byO = {}; let grand = 0;
        for (const r of recs) { if (r.total !== null && r.total > 0) { byO[r.outlet] = (byO[r.outlet]||0) + r.total; grand += r.total; } }
        const entries = Object.entries(byO).sort((a,b) => b[1]-a[1]);
        let off = 0, on = 0;
        for (const r of recs) {
            for (const c of OFFLINE_CHANNELS) if (r.channels[c] !== null) off += r.channels[c];
            for (const c of ONLINE_CHANNELS) if (r.channels[c] !== null) on += r.channels[c];
        }
        const tot = off + on;
        return {
            total: grand, activeOutlets: entries.length, totalOutlets: __allOutlets.length,
            offlinePct: tot > 0 ? off/tot*100 : null, onlinePct: tot > 0 ? on/tot*100 : null,
            best: entries[0]||null, worst: entries[entries.length-1]||null
        };
    }

    function buildDailySeries(recs) {
        const byD = {};
        for (const r of recs) {
            const k = formatMonthKey(r.tanggal) + '-' + String(r.tanggal.getUTCDate()).padStart(2,'0');
            if (!byD[k]) byD[k] = {date:r.tanggal,total:0,has:false};
            if (r.total !== null) { byD[k].total += r.total; byD[k].has = true; }
        }
        return Object.values(byD).sort((a,b) => a.date-b.date).map(s => ({label:formatDateShort(s.date),value:s.has?s.total:null}));
    }

    function buildChannelBreakdown(recs) {
        const sums = {}; for (const c of CHANNEL_KEYS) sums[c] = 0;
        for (const r of recs) for (const c of CHANNEL_KEYS) if (r.channels[c] !== null) sums[c] += r.channels[c];
        const e = Object.entries(sums).filter(([_,v]) => v > 0);
        const tot = e.reduce((s,[_,v]) => s+v, 0);
        return e.sort((a,b) => b[1]-a[1]).map(([n,v]) => ({name:n,value:v,pct:tot>0?v/tot*100:0}));
    }

    function buildRanking(recs, n=10) {
        const byO = {};
        for (const r of recs) if (r.total !== null && r.total > 0) byO[r.outlet] = (byO[r.outlet]||0) + r.total;
        return Object.entries(byO).sort((a,b) => b[1]-a[1]).slice(0,n).map(([n,v]) => ({name:n,value:v}));
    }

    function createCharts() {
        const opts = {
            responsive:true, maintainAspectRatio:false, animation:false,
            plugins:{legend:{display:false},tooltip:{backgroundColor:'#1c1917',titleFont:{family:'Inter',size:12},bodyFont:{family:'Inter',size:12},padding:8,cornerRadius:4,callbacks:{label:ctx => ` ${ctx.dataset.label||''}: ${formatRupiah(ctx.parsed.y ?? ctx.parsed.x ?? ctx.parsed)}`}}},
            scales:{y:{beginAtZero:true,ticks:{callback:v => formatRupiah(v)}}}
        };
        __charts.tren = new Chart(document.getElementById('chart-tren'),{type:'line',data:{labels:[],datasets:[{label:'Omset',data:[],borderColor:'#1c1917',borderWidth:2,pointRadius:3,pointHoverRadius:5,spanGaps:false}]},options:opts});
        __charts.kanal = new Chart(document.getElementById('chart-kanal'),{type:'bar',data:{labels:[],datasets:[{label:'%',data:[],backgroundColor:'#1c1917'}]},options:{...opts,indexAxis:'y',scales:{x:{beginAtZero:true,max:100,ticks:{callback:v=>`${v}%`}}}}});
        __charts.ranking = new Chart(document.getElementById('chart-ranking'),{type:'bar',data:{labels:[],datasets:[{label:'Omset',data:[],backgroundColor:'#1c1917'}]},options:{...opts,indexAxis:'y'}});
    }

    function updateChart(c, labels, values) { c.data.labels = labels; c.data.datasets[0].data = values; c.update('none'); }

    function renderHero(m) {
        document.getElementById('hero-total').textContent = formatRupiah(m.total);
        document.getElementById('hero-total-sub').textContent = __filters.month ? formatMonthLabel(__filters.month) : 'semua periode';
        document.getElementById('hero-outlets').textContent = `${m.activeOutlets} / ${m.totalOutlets}`;
        document.getElementById('hero-outlets-sub').textContent = 'aktif vs total outlet';
        if (m.offlinePct !== null) {
            document.getElementById('hero-channel').textContent = `${Math.round(m.offlinePct)}% / ${Math.round(m.onlinePct)}%`;
            document.getElementById('hero-channel-sub').textContent = 'offline vs online';
        } else {
            document.getElementById('hero-channel').textContent = '–';
            document.getElementById('hero-channel-sub').textContent = '';
        }
        if (m.best && m.worst) {
            document.getElementById('hero-rank').innerHTML = `<span>${m.best[0]}</span><br><small style="color:var(--text-muted)">↓ ${m.worst[0]}</small>`;
            document.getElementById('hero-rank-sub').textContent = `${formatRupiah(m.best[1])} / ${formatRupiah(m.worst[1])}`;
        } else {
            document.getElementById('hero-rank').textContent = '–';
            document.getElementById('hero-rank-sub').textContent = '';
        }
    }

    function renderCharts(fr) {
        const p = __filters.month ? formatMonthLabel(__filters.month) : 'semua periode';
        document.getElementById('chart-tren-period').textContent = p;
        document.getElementById('chart-kanal-period').textContent = p;
        document.getElementById('chart-ranking-period').textContent = p;
        const d = buildDailySeries(fr); const hd = d.some(x => x.value !== null);
        document.getElementById('chart-tren-empty').hidden = hd;
        if (hd) updateChart(__charts.tren, d.map(x=>x.label), d.map(x=>x.value));
        const ch = buildChannelBreakdown(fr);
        document.getElementById('chart-kanal-empty').hidden = ch.length > 0;
        if (ch.length > 0) updateChart(__charts.kanal, ch.map(c=>c.name), ch.map(c=>c.pct));
        const rk = buildRanking(fr);
        document.getElementById('chart-ranking-empty').hidden = rk.length > 0;
        if (rk.length > 0) updateChart(__charts.ranking, rk.map(r=>r.name), rk.map(r=>r.value));
    }

    function updateStatusPill(status, ts) {
        const p = document.getElementById('last-updated');
        p.className = 'status-pill';
        if (status === 'ok') { p.classList.add('status-ok'); p.textContent = `Terakhir diperbarui: ${formatLocalTime(ts)}`; }
        else if (status === 'stale') { p.classList.add('status-stale'); p.textContent = `Stale · ${formatLocalTime(ts)}`; }
        else if (status === 'error') { p.classList.add('status-error'); p.textContent = 'Gagal memuat data'; }
        else { p.classList.add('status-loading'); p.textContent = 'Memuat data…'; }
    }

    function populateFilterControls(recs) {
        const ms = document.getElementById('filter-month');
        const months = [...new Set(recs.map(r => formatMonthKey(r.tanggal)))].sort();
        if (ms.options.length <= 1) for (const m of months) { const o = document.createElement('option'); o.value = m; o.textContent = formatMonthLabel(m); ms.appendChild(o); }
        const os = document.getElementById('filter-outlet');
        const existing = new Set(Array.from(os.options).map(o => o.value));
        const newO = [...new Set(recs.map(r => r.outlet))].sort();
        __allOutlets = newO;
        for (const n of newO) if (!existing.has(n)) { const o = document.createElement('option'); o.value = n; o.textContent = n; os.appendChild(o); }
    }

    function readFilterState() {
        __filters.month = document.getElementById('filter-month').value;
        __filters.jenis = document.getElementById('filter-jenis').value;
        __filters.outlets = Array.from(document.getElementById('filter-outlet').selectedOptions).map(o => o.value);
    }

    function applyActiveFiltersAndRender() {
        readFilterState();
        const src = __lastGoodData || [];
        const f = applyFilters(src);
        renderHero(computeMetrics(f));
        renderCharts(f);
    }

    async function refreshCycle(first = false) {
        try {
            const json = await fetchFromAPI();
            const records = transformRecords(json);
            __lastGoodData = records;
            __lastFetchTime = json.fetchedAt;
            populateFilterControls(records);
            applyActiveFiltersAndRender();
            updateStatusPill('ok', __lastFetchTime);
            if (first) console.table({rowsKept: json.rowsKept, separatorsDropped: json.separatorsDropped, badDatesDropped: json.badDatesDropped});
            document.getElementById('loading-state').hidden = true;
            document.getElementById('dashboard-content').hidden = false;
        } catch (err) {
            console.warn('[refresh]', err.message);
            if (first) { updateStatusPill('error', null); document.getElementById('loading-state').textContent = `Gagal memuat: ${err.message}`; }
            else if (__lastGoodData) { applyActiveFiltersAndRender(); updateStatusPill('stale', __lastFetchTime); }
            else updateStatusPill('error', null);
        }
    }

    function startTimer() { stopTimer(); __refreshTimer = setInterval(() => { if (!document.hidden) refreshCycle(false); }, REFRESH_INTERVAL_MS); }
    function stopTimer() { if (__refreshTimer) { clearInterval(__refreshTimer); __refreshTimer = null; } }
    document.addEventListener('visibilitychange', () => { if (!document.hidden && __lastGoodData) refreshCycle(false); });

    function init() {
        createCharts();
        document.getElementById('refresh-btn').addEventListener('click', () => {
            const b = document.getElementById('refresh-btn'); b.disabled = true;
            refreshCycle(false).finally(() => { b.disabled = false; });
        });
        ['filter-month','filter-jenis','filter-outlet'].forEach(id => document.getElementById(id).addEventListener('change', applyActiveFiltersAndRender));
        refreshCycle(true).then(startTimer);
    }
    init();
    </script>
</body>
</html>
