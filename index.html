<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Omset CCI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef5;--tx:#0f1b2d;--mu:#56657b;--gl:rgba(255,255,255,.58);--bd:rgba(255,255,255,.8);--sh:0 10px 34px rgba(30,50,90,.13);--ac:#0b7a8a;--ac2:#2563eb;--ok:#15803d;--bad:#b91c1c;--wa:#b45309;--tr:rgba(15,27,45,.09);--o1:#7dd3d8;--o2:#a9b8f5}
[data-theme=dark]{--bg:#0a111e;--tx:#e8edf7;--mu:#97a4bb;--gl:rgba(22,32,52,.55);--bd:rgba(255,255,255,.1);--sh:0 10px 34px rgba(0,0,0,.45);--ac:#4fd1c5;--ac2:#7aa2ff;--ok:#4ade80;--bad:#f87171;--wa:#fbbf24;--tr:rgba(255,255,255,.09);--o1:#0f5c68;--o2:#27368f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 420px at 8% 6%,var(--o1),transparent 70%),radial-gradient(620px 520px at 95% 30%,var(--o2),transparent 70%);opacity:.55}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;margin:0}
.sub{color:var(--mu);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--gl);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:18px;min-width:0}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:3fr 2fr}
@media(max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g21{grid-template-columns:1fr}}
@media(max-width:520px){.g4{grid-template-columns:1fr}.wrap{padding:14px 10px 40px}}
.sec-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
select,button{font:inherit;color:var(--tx);background:var(--gl);border:1px solid var(--bd);border-radius:12px;padding:7px 12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
select{box-shadow:inset 0 0 0 1px var(--tr)}
button{cursor:pointer;box-shadow:inset 0 0 0 1px var(--tr)}
button:hover,select:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.seg{display:inline-flex;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--tr)}
.seg button{border:0;border-radius:0;box-shadow:none}
.seg button.on{background:var(--ac);color:#fff}
.kpi .l{color:var(--mu);font-size:13px}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.kpi .n{font-size:12.5px;color:var(--mu)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.banner{border-radius:16px;padding:12px 16px;margin-bottom:14px;border:1px solid var(--wa);background:var(--gl);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--tx)}
.banner b{color:var(--wa)}
.split{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--tr);margin:10px 0 8px}
.split i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mu)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--tr)}
th:first-child,td:first-child,th.t,td.t{text-align:left}
th{font-weight:600;color:var(--mu);font-size:12.5px}
tr:last-child td{border-bottom:0}
.bar{height:6px;border-radius:9px;background:var(--tr);min-width:70px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ac)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--tr);color:var(--mu)}
.mut{color:var(--mu)}
.donut{width:190px;height:190px;flex:none}
.dc1{font-size:13px;fill:var(--mu)}.dc2{font-size:15px;font-weight:700;fill:var(--tx)}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:260px}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--tr)}
.list li:last-child{border-bottom:0}
.ins{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ins li{padding:10px 14px;border-radius:14px;background:var(--tr);border-left:3px solid var(--ac)}
.ins li.warn{border-left-color:var(--wa)}.ins li.ok{border-left-color:var(--ok)}.ins li.bad{border-left-color:var(--bad)}
.empty{color:var(--mu);padding:14px 0}
.stat{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu)}
.stat i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.stat.err i{background:var(--bad)}
svg text{font-family:inherit}
@media(prefers-reduced-motion:no-preference){.bar i,.split i{transition:width .4s ease}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Omset Chicken Crush Indonesia</h1>
    <div class="sub" id="periode">Memuat data…</div>
  </div>
  <div class="tools">
    <span class="stat" id="stat"><i></i><span>Menghubungkan…</span></span>
    <button id="refresh" type="button">Muat ulang</button>
    <button id="theme" type="button" aria-label="Ganti tema">Mode gelap</button>
  </div>
</header>

<div id="banner"></div>
<div class="grid g4" id="kpi"></div>

<div class="grid g21">
  <section class="card">
    <div class="sec-h"><h2>Omset Pusat dan Mitra</h2></div>
    <div id="pm"></div>
    <div id="daily"></div>
  </section>
  <section class="card">
    <div class="sec-h"><h2>Analisa otomatis</h2></div>
    <ul class="ins" id="ins"></ul>
  </section>
</div>

<section class="card grid-item" style="margin-bottom:14px">
  <div class="sec-h"><h2>Penjualan per kategori</h2>
    <select id="selKat" aria-label="Kelompok outlet"><option value="ALL">Semua outlet</option><option value="PUSAT">Pusat</option><option value="MITRA">Mitra</option></select></div>
  <div id="kat"></div>
</section>

<section class="card" style="margin-bottom:14px">
  <div class="sec-h"><h2>Ranking outlet</h2>
    <select id="selRank" aria-label="Kelompok outlet"><option value="ALL">Semua</option><option value="PUSAT">Pusat</option><option value="MITRA">Mitra</option></select></div>
  <div id="rank"></div>
</section>

<div class="grid g2">
  <section class="card">
    <div class="sec-h"><h2>Bulan berjalan dan bulan sebelumnya</h2>
      <select id="selCmp" aria-label="Kelompok outlet"><option value="ALL">Semua outlet</option><option value="PUSAT">Pusat</option><option value="MITRA">Mitra</option></select></div>
    <div id="cmp"></div>
  </section>
  <section class="card">
    <div class="sec-h"><h2>Menu tertinggi dan terendah</h2>
      <div class="seg" role="group" aria-label="Urutkan menu"><button type="button" data-m="qty" class="on">Qty</button><button type="button" data-m="val">Nilai</button></div></div>
    <div id="menu"></div>
  </section>
</div>
</div>

<script>
const API_URL = 'GANTI_DENGAN_URL_WEB_APP';
const TOKEN = '';
const REFRESH_MS = 60000;

const K = ['Dine In', 'Take Away', 'ESB Order', 'ESB Delivery', 'GoFood', 'GrabFood', 'ShopeeFood'];
const KC = ['#3b82f6', '#06b6d4', '#8b5cf6', '#94a3b8', '#ef4444', '#22c55e', '#f97316'];
const OFFLINE = [0, 1];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const jt = n => n >= 1e9 ? (n / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' M' : n >= 1e6 ? (n / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt' : Math.round(n).toLocaleString('id-ID');
const pf = (x, d = 1) => x.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const sum = a => a.reduce((x, y) => x + y, 0);
const share = (a, b) => b ? a / b * 100 : 0;
const MON = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const sign = x => (x > 0 ? '+' : '') + pf(x);

let D = null, raw = '';
const S = { kat: 'ALL', rank: 'ALL', cmp: 'ALL', menu: 'qty' };

/* ---------- data ---------- */
function prep(r) {
  const jOf = {};
  r.outlets.forEach(o => { jOf[o.n] = o.j; });
  const mk = x => ({ d: x[0], day: +x[0].slice(8), o: x[1], j: jOf[x[1]] || 'MITRA', v: x.slice(2), t: sum(x.slice(2)) });
  const rows = r.rows.map(mk).filter(x => x.t > 0);
  const [Y, M] = r.bulan.slice(0, 7).split('-').map(Number);
  const pd = new Date(Y, M - 2, 1);
  const pym = pd.getFullYear() + '-' + String(pd.getMonth() + 1).padStart(2, '0');
  const arsip = r.arsip.map(mk).filter(x => x.d.slice(0, 7) === pym && x.t > 0);
  const dim = new Date(Y, M, 0).getDate(), pdim = new Date(Y, M - 1, 0).getDate();

  const by = {};
  rows.forEach(x => { (by[x.day] = by[x.day] || new Set()).add(x.o); });
  const days = Object.keys(by).map(Number);
  const N = days.length ? Math.max(...days) : 0;
  const mx = days.length ? Math.max(...days.map(d => by[d].size)) : 0;
  let C = 0;
  days.forEach(d => { if (by[d].size >= 0.9 * mx && d > C) C = d; });

  const os = r.outlets.map(o => {
    const rs = rows.filter(x => x.o === o.n);
    return {
      ...o, t: sum(rs.map(x => x.t)), dd: rs.length, last: rs.length ? Math.max(...rs.map(x => x.day)) : 0,
      tg: r.target[o.n] || 0, prev: r.prev[o.n] || 0, v: K.map((_, i) => sum(rs.map(x => x.v[i])))
    };
  });
  os.forEach(o => { o.avg = o.dd ? o.t / o.dd : 0; });
  return { ...r, Y, M, pym, dim, pdim, rows, arsip, N, C, os, total: sum(os.map(o => o.t)) };
}
const grp = (list, j) => j === 'ALL' ? list : list.filter(x => x.j === j);
const chan = rs => K.map((_, i) => sum(rs.map(x => x.v[i])));

/* ---------- komponen ---------- */
function donut(items, center) {
  const R = 68, Cc = 2 * Math.PI * R, tot = sum(items.map(i => i.v));
  let off = 0;
  const arcs = items.filter(i => i.v > 0).map(i => {
    const l = i.v / tot * Cc;
    const s = `<circle r="${R}" cx="90" cy="90" fill="none" stroke="${i.c}" stroke-width="26" stroke-dasharray="${l} ${Cc - l}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${esc(i.l)}: ${rp(i.v)} (${pf(share(i.v, tot))})</title></circle>`;
    off += l;
    return s;
  }).join('');
  return `<svg viewBox="0 0 180 180" class="donut" role="img" aria-label="${esc(center[0])}"><circle r="${R}" cx="90" cy="90" fill="none" stroke="var(--tr)" stroke-width="26"/>${arcs}<text x="90" y="88" text-anchor="middle" class="dc1">${esc(center[0])}</text><text x="90" y="108" text-anchor="middle" class="dc2">${esc(center[1])}</text></svg>`;
}
const arrow = x => `<span class="${x >= 0 ? 'up' : 'dn'}">${x >= 0 ? '▲' : '▼'} ${sign(x)}</span>`;

/* ---------- render ---------- */
function render() {
  const d = D;
  $('#periode').textContent = `${MON[d.M - 1]} ${d.Y}` + (d.N ? ` · data sampai tanggal ${d.N}` : ' · belum ada data');
  if (!d.rows.length) {
    $('#banner').innerHTML = '<div class="banner"><b>Belum ada data omset</b> untuk bulan laporan ini. Isi sheet INPUT OMSET.</div>';
    ['#kpi', '#pm', '#daily', '#kat', '#rank', '#cmp', '#menu', '#ins'].forEach(s => { $(s).innerHTML = ''; });
    return;
  }
  banner(); kpi(); pm(); kat(); rank(); cmp(); menu(); $('#ins').innerHTML = analisa().map(a => `<li class="${a.k}">${a.t}</li>`).join('');
}

function banner() {
  const none = D.os.filter(o => o.dd === 0), lag = D.os.filter(o => o.dd > 0 && o.last < D.N);
  $('#banner').innerHTML = none.length + lag.length
    ? `<div class="banner"><b>Data belum lengkap.</b> ${none.length} outlet belum punya data sama sekali dan ${lag.length} outlet datanya belum sampai tanggal ${D.N}. Total omset dan perbandingan bulan lalu bisa lebih rendah dari kondisi sebenarnya.</div>` : '';
}

function kpi() {
  const p = sum(grp(D.os, 'PUSAT').map(o => o.t)), m = sum(grp(D.os, 'MITRA').map(o => o.t));
  const avg = D.N ? D.total / D.N : 0;
  const nP = grp(D.os, 'PUSAT').length, nM = grp(D.os, 'MITRA').length;
  const c = [
    ['Total omset', rp(D.total), `Rata-rata ${rp(avg)} per hari`],
    ['Omset pusat', rp(p), `${pf(share(p, D.total))} dari total · ${nP} outlet`],
    ['Omset mitra', rp(m), `${pf(share(m, D.total))} dari total · ${nM} outlet`],
    ['Proyeksi akhir bulan', rp(avg * D.dim), `Rata-rata per hari × ${D.dim} hari`]
  ];
  $('#kpi').innerHTML = c.map(x => `<div class="card kpi"><div class="l">${x[0]}</div><div class="v">${x[1]}</div><div class="n">${x[2]}</div></div>`).join('');
}

function pm() {
  const p = sum(grp(D.os, 'PUSAT').map(o => o.t)), m = D.total - p;
  const days = [];
  for (let i = 1; i <= D.dim; i++) {
    const rs = D.rows.filter(x => x.day === i);
    days.push({ i, p: sum(rs.filter(x => x.j === 'PUSAT').map(x => x.t)), m: sum(rs.filter(x => x.j === 'MITRA').map(x => x.t)) });
  }
  const mx = Math.max(...days.map(x => x.p + x.m), 1), W = 640, H = 190, bw = W / D.dim;
  const bars = days.map(x => {
    const hm = x.m / mx * (H - 24), hp = x.p / mx * (H - 24), cut = x.i > D.C ? .4 : 1, X = (x.i - 1) * bw + 2;
    return `<g opacity="${cut}"><rect x="${X}" y="${H - hm - hp}" width="${bw - 4}" height="${hm}" rx="2" fill="var(--ac2)"/><rect x="${X}" y="${H - hp}" width="${bw - 4}" height="${hp}" rx="2" fill="var(--ac)"/><rect x="${X - 1}" y="0" width="${bw - 2}" height="${H}" fill="transparent"><title>Tanggal ${x.i}: ${rp(x.p + x.m)} (pusat ${rp(x.p)}, mitra ${rp(x.m)})</title></rect></g>`;
  }).join('');
  const lb = [1, 5, 10, 15, 20, 25, D.dim].filter((v, i, a) => a.indexOf(v) === i && v <= D.dim)
    .map(v => `<text x="${(v - .5) * bw}" y="${H + 14}" text-anchor="middle" font-size="11" fill="var(--mu)">${v}</text>`).join('');
  $('#pm').innerHTML = `<div class="two"><div><div class="mut">Pusat</div><div class="big">${rp(p)}</div><div class="mut">${pf(share(p, D.total))} dari total</div></div><div><div class="mut">Mitra</div><div class="big">${rp(m)}</div><div class="mut">${pf(share(m, D.total))} dari total</div></div></div>
  <div class="split" role="img" aria-label="Komposisi pusat dan mitra"><i style="width:${share(p, D.total)}%;background:var(--ac)"></i><i style="width:${share(m, D.total)}%;background:var(--ac2)"></i></div>
  <div class="leg"><span><span class="dot" style="background:var(--ac)"></span>Pusat</span><span><span class="dot" style="background:var(--ac2)"></span>Mitra</span></div>`;
  $('#daily').innerHTML = `<div class="sub" style="margin:16px 0 6px">Omset harian${D.C < D.N ? ' · batang pudar: data outlet belum lengkap' : ''}</div><svg viewBox="0 0 ${W} ${H + 20}" width="100%" role="img" aria-label="Omset harian">${bars}${lb}</svg>`;
}

function kat() {
  const rs = grp(D.rows, S.kat), v = chan(rs), tot = sum(v), all = sum(chan(D.rows));
  const items = K.map((l, i) => ({ l, v: v[i], c: KC[i] }));
  const off = sum(OFFLINE.map(i => v[i]));
  const showAll = S.kat !== 'ALL';
  $('#kat').innerHTML = `<div class="row"><div>${donut(items, [S.kat === 'ALL' ? 'Semua outlet' : S.kat === 'PUSAT' ? 'Pusat' : 'Mitra', jt(tot)])}</div>
  <div class="grow scroll"><table><thead><tr><th>Kategori</th><th>Omset</th><th>% dalam ${S.kat === 'ALL' ? 'total' : 'kelompok'}</th>${showAll ? '<th>% thd total omset</th>' : ''}</tr></thead><tbody>${items.map(i => `<tr><td><span class="dot" style="background:${i.c}"></span>${i.l}</td><td>${rp(i.v)}</td><td>${pf(share(i.v, tot), 2)}</td>${showAll ? `<td>${pf(share(i.v, all), 2)}</td>` : ''}</tr>`).join('')}<tr><td><b>Total</b></td><td><b>${rp(tot)}</b></td><td><b>${tot ? '100,00%' : '–'}</b></td>${showAll ? `<td><b>${pf(share(tot, all), 2)}</b></td>` : ''}</tr></tbody></table>
  <div class="sub" style="margin-top:8px">Offline (Dine In + Take Away) ${pf(share(off, tot))} · Online dan delivery ${pf(share(tot - off, tot))}</div></div></div>`;
}

function rank() {
  const list = grp(D.os, S.rank).slice().sort((a, b) => b.t - a.t || a.n.localeCompare(b.n));
  const tot = sum(list.map(o => o.t)), mx = Math.max(...list.map(o => o.t), 1);
  const hasMitraTarget = D.os.some(o => o.j === 'MITRA' && o.tg > 0);
  $('#rank').innerHTML = `<div class="scroll"><table><thead><tr><th>#</th><th class="t">Outlet</th><th>Omset</th><th class="t"> </th><th>Hari ada data</th><th>Rata-rata/hari</th><th>Kontribusi</th><th>Target bulanan</th><th>Capaian</th></tr></thead><tbody>${list.map((o, i) => {
    const cp = o.tg ? share(o.t, o.tg) : null;
    return `<tr><td>${i + 1}</td><td class="t">${esc(o.n)} <span class="tag">${o.j === 'PUSAT' ? 'Pusat' : 'Mitra'}</span></td><td>${o.dd ? rp(o.t) : '<span class="mut">Belum ada data</span>'}</td><td class="t"><div class="bar"><i style="width:${o.t / mx * 100}%"></i></div></td><td>${o.dd}</td><td>${o.dd ? rp(o.avg) : '–'}</td><td>${o.dd ? pf(share(o.t, tot)) : '–'}</td><td>${o.tg ? rp(o.tg) : '–'}</td><td>${cp === null ? '–' : `<span class="${cp >= 100 ? 'up' : ''}">${pf(cp)}</span>`}</td></tr>`;
  }).join('')}</tbody></table></div>${hasMitraTarget ? '' : '<div class="sub" style="margin-top:8px">Target mitra belum diisi. Isi di tab TARGET MITRA pada spreadsheet.</div>'}`;
}

function compare(j) {
  const cur = grp(D.rows, j).filter(x => x.day <= D.C), cv = chan(cur), ct = sum(cv);
  const pr = grp(D.arsip, j).filter(x => x.day <= D.C);
  if (pr.length) { const pv = chan(pr); return { mode: 'arsip', ct, pt: sum(pv), cv, pv }; }
  let base = 0;
  if (j === 'ALL') base = D.prevTotal;
  else if (j === 'PUSAT') base = sum(grp(D.os, 'PUSAT').map(o => o.prev));
  return base > 0 ? { mode: 'est', ct, pt: base / D.pdim * D.C, cv, base } : { mode: 'none', ct, cv };
}

function cmp() {
  const c = compare(S.cmp), per = `tanggal 1–${D.C} ${MON[D.M - 1]}`;
  if (c.mode === 'none') { $('#cmp').innerHTML = `<div class="empty">Data bulan sebelumnya untuk kelompok ini belum tersedia. Isi OMSET BLN LALU di INPUT OMSET, atau arsipkan data bulan lalu (lihat README).</div>`; return; }
  const diff = c.ct - c.pt, p = share(diff, c.pt);
  const rows = c.mode === 'arsip' ? `<div class="scroll" style="margin-top:12px"><table><thead><tr><th>Kategori</th><th>Bulan ini</th><th>Bulan lalu</th><th>Perubahan</th></tr></thead><tbody>${K.map((l, i) => `<tr><td><span class="dot" style="background:${KC[i]}"></span>${l}</td><td>${rp(c.cv[i])}</td><td>${rp(c.pv[i])}</td><td>${c.pv[i] ? arrow(share(c.cv[i] - c.pv[i], c.pv[i])) : '–'}</td></tr>`).join('')}</tbody></table></div>` : '';
  $('#cmp').innerHTML = `<div class="sub">Dibandingkan pada ${per}, saat data seluruh outlet aktif lengkap</div>
  <div class="row" style="margin:8px 0"><div class="big">${arrow(p)}</div><div class="mut">${rp(Math.abs(diff))} ${diff >= 0 ? 'lebih tinggi' : 'lebih rendah'} dari bulan lalu</div></div>
  <div class="two"><div><div class="mut">Bulan ini</div><b>${rp(c.ct)}</b></div><div><div class="mut">Bulan lalu${c.mode === 'est' ? ' (estimasi)' : ''}</div><b>${rp(c.pt)}</b></div></div>
  ${c.mode === 'est' ? `<div class="sub" style="margin-top:8px">Estimasi dari omset total bulan lalu ${rp(c.base)} ÷ ${D.pdim} hari × ${D.C} hari. Untuk perbandingan per kategori, arsipkan data bulan lalu.</div>` : ''}${rows}`;
}

function menu() {
  const m = D.menu;
  document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === S.menu));
  let top, bot;
  if (m.mode === 'full') {
    const k = S.menu === 'qty' ? 1 : 2, s = m.rows.slice().sort((a, b) => b[k] - a[k]);
    top = s.slice(0, 5); bot = s.slice(-5).reverse();
  } else if (m.top.length || m.bottom.length) {
    if (S.menu === 'val') { $('#menu').innerHTML = '<div class="empty">Peringkat berdasarkan nilai butuh daftar menu lengkap. Isi tab DATA MENU (menu, qty, nilai).</div>'; return; }
    top = m.top; bot = m.bottom;
  } else { $('#menu').innerHTML = '<div class="empty">Data menu belum diisi. Isi tab PERFORMA MENU atau DATA MENU pada spreadsheet.</div>'; return; }
  const val = x => S.menu === 'qty' ? x[1].toLocaleString('id-ID') + ' porsi' : rp(x[2]);
  const li = a => a.map((x, i) => `<li><span>${i + 1}. ${esc(x[0])}</span><b>${val(x)}</b></li>`).join('');
  $('#menu').innerHTML = `<div class="two"><div><div class="mut" style="margin-bottom:4px">5 tertinggi</div><ul class="list">${li(top)}</ul></div><div><div class="mut" style="margin-bottom:4px">5 terendah</div><ul class="list">${li(bot)}</ul></div></div>`;
}

function analisa() {
  const L = [], d = D, avg = d.N ? d.total / d.N : 0;
  const P = grp(d.os, 'PUSAT'), Mi = grp(d.os, 'MITRA'), p = sum(P.map(o => o.t));
  L.push({ k: 'info', t: `Total omset <b>${rp(d.total)}</b> sampai tanggal ${d.N}. Pusat ${pf(share(p, d.total))}, mitra ${pf(share(d.total - p, d.total))}.` });
  const v = chan(d.rows), idx = v.map((x, i) => i).sort((a, b) => v[b] - v[a]), off = sum(OFFLINE.map(i => v[i]));
  L.push({ k: 'info', t: `<b>${K[idx[0]]}</b> kanal terbesar (${pf(share(v[idx[0]], d.total))}), disusul ${K[idx[1]]} (${pf(share(v[idx[1]], d.total))}). Offline ${pf(share(off, d.total))}, online dan delivery ${pf(share(d.total - off, d.total))}.` });
  const zero = K.filter((_, i) => v[i] === 0);
  if (zero.length) L.push({ k: 'warn', t: `${zero.join(', ')} belum mencatat omset pada periode ini. Pastikan memang belum ada transaksi, bukan belum diinput.` });
  const top = d.os.slice().sort((a, b) => b.t - a.t).slice(0, 3);
  L.push({ k: 'info', t: `Tiga outlet teratas: ${top.map(o => `${esc(o.n)} (${pf(share(o.t, d.total))})`).join(', ')}, bersama ${pf(share(sum(top.map(o => o.t)), d.total))} dari total.` });
  const dt = {};
  d.rows.filter(x => x.day <= d.C).forEach(x => { dt[x.day] = (dt[x.day] || 0) + x.t; });
  const ks = Object.keys(dt).map(Number);
  if (ks.length > 2) {
    const hi = ks.reduce((a, b) => dt[a] >= dt[b] ? a : b), lo = ks.reduce((a, b) => dt[a] <= dt[b] ? a : b);
    const we = ks.filter(k => [0, 6].includes(new Date(d.Y, d.M - 1, k).getDay())), wd = ks.filter(k => !we.includes(k));
    let t = `Dari tanggal 1–${d.C}, omset harian tertinggi tanggal ${hi} (${rp(dt[hi])}) dan terendah tanggal ${lo} (${rp(dt[lo])}).`;
    if (we.length && wd.length) { const a = sum(we.map(k => dt[k])) / we.length, b = sum(wd.map(k => dt[k])) / wd.length; t += ` Rata-rata akhir pekan ${rp(a)}, hari kerja ${rp(b)} (${sign(share(a - b, b))}).`; }
    L.push({ k: 'info', t });
  }
  const none = d.os.filter(o => o.dd === 0).length, lag = d.os.filter(o => o.dd > 0 && o.last < d.N).length;
  if (none + lag) L.push({ k: 'warn', t: `${none} outlet belum ada data dan ${lag} outlet tertinggal. Angka total, rata-rata harian, dan proyeksi memakai data yang masuk saja.` });
  const c = compare('ALL');
  if (c.mode !== 'none') L.push({ k: c.ct >= c.pt ? 'ok' : 'bad', t: `Dibanding bulan lalu pada tanggal 1–${d.C}: ${sign(share(c.ct - c.pt, c.pt))} (${rp(c.ct)} vs ${rp(c.pt)}${c.mode === 'est' ? ', estimasi' : ''}).` });
  const left = d.dim - d.N;
  [['Pusat', P], ['Mitra', Mi]].forEach(([n, g]) => {
    const tg = g.filter(o => o.tg > 0), T = sum(tg.map(o => o.tg)), R = sum(tg.map(o => o.t));
    if (!T) return;
    const need = Math.max(T - R, 0);
    L.push({ k: R >= T ? 'ok' : 'info', t: `Target ${n} (${tg.length} outlet terisi): ${rp(R)} dari ${rp(T)} (${pf(share(R, T))}).` + (R < T && left > 0 ? ` Butuh ${rp(need / left)} per hari selama ${left} hari tersisa.` : '') });
  });
  return L;
}

/* ---------- koneksi ---------- */
function stat(ok, msg) {
  const el = $('#stat');
  el.className = 'stat' + (ok ? '' : ' err');
  el.lastChild.textContent = ok ? 'Diperbarui ' + new Date().toLocaleTimeString('id-ID') : msg;
}
async function load() {
  if (API_URL.indexOf('http') !== 0) { stat(false, 'URL web app belum diisi di index.html'); return; }
  try {
    const q = (TOKEN ? 'token=' + encodeURIComponent(TOKEN) + '&' : '') + 't=' + Date.now();
    const res = await fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + q);
    const txt = await res.text();
    if (txt !== raw) {
      const j = JSON.parse(txt);
      if (j.error) throw new Error(j.error);
      D = prep(j); raw = txt; render();
    }
    stat(true);
  } catch (e) { stat(false, 'Gagal memuat: ' + e.message); }
}

/* ---------- interaksi ---------- */
const safe = f => { try { return f(); } catch (e) { return null; } };
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#theme').textContent = t === 'dark' ? 'Mode cerah' : 'Mode gelap';
  safe(() => localStorage.setItem('theme', t));
}
setTheme(safe(() => localStorage.getItem('theme')) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('#refresh').onclick = load;
$('#selKat').onchange = e => { S.kat = e.target.value; if (D) kat(); };
$('#selRank').onchange = e => { S.rank = e.target.value; if (D) rank(); };
$('#selCmp').onchange = e => { S.cmp = e.target.value; if (D) cmp(); };
document.querySelectorAll('[data-m]').forEach(b => { b.onclick = () => { S.menu = b.dataset.m; if (D) menu(); }; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
load();
</script>
