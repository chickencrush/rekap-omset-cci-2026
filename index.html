<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Omset CCI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c1917;background:#fafaf9;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;line-height:1.5}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px;background:#fff;border-bottom:1px solid #e7e5e4}.header h1{font-size:18px;margin:0}.header-actions{display:flex;align-items:center;gap:12px}.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:#f5f5f4;color:#57534e}.pill.ok{background:#f0fdf4;color:#15803d}.pill.error{background:#fef2f2;color:#b91c1c}button,select{font:inherit}button{padding:7px 12px;border:1px solid #d6d3d1;border-radius:6px;background:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:wait}main{max-width:1200px;margin:auto;padding:24px}.notice{padding:16px;margin:16px 0;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;color:#9a3412;white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none!important}.filters{display:flex;align-items:end;gap:12px;flex-wrap:wrap;padding:16px;margin-bottom:16px;background:#fff;border:1px solid #e7e5e4;border-radius:8px}.filters label{display:grid;gap:4px;font-size:12px;color:#57534e}.filters select{min-width:150px;padding:7px;border:1px solid #d6d3d1;border-radius:6px;background:#fff;color:#1c1917}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}.card{padding:16px;background:#fff;border:1px solid #e7e5e4;border-radius:8px}.card-label{font-size:12px;color:#57534e;text-transform:uppercase}.card-value{font-size:24px;font-weight:700;margin-top:4px}.table-wrap{overflow:auto;background:#fff;border:1px solid #e7e5e4;border-radius:8px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #f0eeec;font-size:13px}th{font-size:11px;text-transform:uppercase;color:#57534e;background:#fafaf9}td.number,th.number{text-align:right}tbody tr:last-child td{border-bottom:0}.empty{padding:28px;text-align:center;color:#78716c}.foot{padding:16px 0;color:#78716c;font-size:11px}@media(max-width:600px){.header{padding:12px 16px;align-items:flex-start}.header h1{font-size:16px}.header-actions{gap:6px;flex-wrap:wrap;justify-content:flex-end}main{padding:16px}.filters{align-items:stretch}.filters label,.filters select{width:100%}.card-value{font-size:20px}}
</style>
</head>
<body>
<header class="header"><h1>Rekap Omset CCI</h1><div class="header-actions"><span id="status" class="pill">Memuat data…</span><button id="refresh" type="button">Refresh</button></div></header>
<main>
<div id="message" class="notice">Menghubungkan ke Google Sheets…</div>
<section id="dashboard" class="hidden">
<div class="filters"><label>Periode<select id="month"><option value="">Semua bulan</option></select></label><label>Jenis outlet<select id="jenis"><option value="ALL">Semua</option><option value="PUSAT">Pusat</option><option value="MITRA">Mitra</option></select></label><label>Outlet<select id="outlet"><option value="">Semua outlet</option></select></label></div>
<div class="cards"><div class="card"><div class="card-label">Total Omset</div><div id="total" class="card-value">–</div></div><div class="card"><div class="card-label">Outlet Aktif</div><div id="active" class="card-value">–</div></div><div class="card"><div class="card-label">Jumlah Data</div><div id="count" class="card-value">–</div></div></div>
<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Outlet</th><th>Jenis</th><th class="number">Offline</th><th class="number">Online</th><th class="number">Total Omset</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">Tidak ada data untuk filter yang dipilih.</div></div>
</section>
<div id="footer" class="foot"></div>
</main>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbxQ1MAD0eQ3PHosbEjW_k1F6zImJQKwtNJVTKPuqOVKMYSZguxFgFUMqd3WpIaBgZCE/exec';
const REFRESH_INTERVAL_MS=60000;
const CHANNELS=['DINE IN','TAKE AWAY','ESB ORDER','ESB DELIVERY','GOFOOD','GRABFOOD','SHOPEFOOD'];
let records=[];
const $=id=>document.getElementById(id);
function number(value){if(typeof value==='number')return Number.isFinite(value)?value:0;if(value==null||value==='')return 0;const n=Number(String(value).replace(/[Rp\\s.]/g,'').replace(',','.'));return Number.isFinite(n)?n:0;}
function parseDate(value){if(value instanceof Date&&!isNaN(value))return value;if(value==null||value==='')return null;const s=String(value).trim();let m=s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);if(m){const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));return isNaN(d)?null:d;}m=s.match(/^(\\d{1,2})[\\/.-](\\d{1,2})[\\/.-](\\d{4})$/);if(m){const d=new Date(Date.UTC(+m[3],+m[2]-1,+m[1]));return isNaN(d)?null:d;}const d=new Date(s);return isNaN(d)?null:d;}
function monthKey(date){return date?`${date.getUTCFullYear()}-${String(date.getUTCMonth()+1).padStart(2,'0')}`:'';}
function rupiah(value){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(value||0);}
function dateLabel(date){return date?new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'}).format(date):'–';}
function normalizeRow(row){const channels=row.channels&&typeof row.channels==='object'?row.channels:{};const normalized={tanggal:parseDate(row.tanggal??row.date??row.Tanggal),outlet:String(row.outlet??row.Outlet??'').trim(),jenis:String(row.jenis??row.Jenis??'').trim().toUpperCase(),channels:{}};for(const key of CHANNELS){const source=Object.keys(channels).find(k=>k.trim().toUpperCase()===key);normalized.channels[key]=number(source?channels[source]:row[key]??row[key.toLowerCase()]);}const channelTotal=Object.values(normalized.channels).reduce((a,b)=>a+b,0);normalized.total=number(row.total??row.Total??row.omset??row.Omset)||channelTotal;return normalized;}
function extractRows(json){if(Array.isArray(json))return json;if(json&&Array.isArray(json.data))return json.data;if(json&&Array.isArray(json.records))return json.records;if(json&&json.result&&Array.isArray(json.result.data))return json.result.data;if(json&&json.ok===false)throw new Error(json.error||json.message||'API mengembalikan ok:false');throw new Error('Format respons tidak dikenali. API harus mengembalikan array data.');}
async function loadData(){const button=$('refresh');button.disabled=true;$('status').className='pill';$('status').textContent='Memuat data…';try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),20000);let response;try{response=await fetch(`${API_URL}${API_URL.includes('?')?'&':'?'}t=${Date.now()}`,{cache:'no-store',signal:controller.signal,redirect:'follow'});}finally{clearTimeout(timeout);}if(!response.ok)throw new Error(`Server mengembalikan HTTP ${response.status}. Periksa izin deployment Google Apps Script.`);const json=await response.json();const incoming=extractRows(json).map(normalizeRow).filter(r=>r.tanggal&&r.outlet);if(!incoming.length)throw new Error('Respons berhasil diterima, tetapi tidak berisi baris data yang valid. Pastikan kolom tanggal dan outlet tersedia.');records=incoming;populateFilters();render();$('dashboard').classList.remove('hidden');$('message').classList.add('hidden');$('status').className='pill ok';const fetched=json&&json.fetchedAt?new Date(json.fetchedAt):new Date();$('status').textContent=`Diperbarui ${fetched.toLocaleTimeString('id-ID')}`;}catch(error){const detail=error.name==='AbortError'?'Permintaan ke Google Sheets melewati batas waktu 20 detik.':error.message; $('status').className='pill error';$('status').textContent='Gagal memuat';$('message').textContent=`Data tidak dapat dimuat: ${detail}\n\nPeriksa koneksi internet, URL deployment, dan akses Google Apps Script (deployment harus dapat diakses oleh pengguna aplikasi). Tekan Refresh untuk mencoba lagi.`;$('message').classList.remove('hidden');if(records.length){$('dashboard').classList.remove('hidden');render();}}finally{button.disabled=false;}}
function populateFilters(){const month=$('month'),outlet=$('outlet'),selectedMonth=month.value,selectedOutlet=outlet.value;const months=[...new Set(records.map(r=>monthKey(r.tanggal)))].sort().reverse();month.innerHTML='<option value="">Semua bulan</option>'+months.map(m=>{const [y,n]=m.split('-');const label=new Intl.DateTimeFormat('id-ID',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(+y,+n-1,1)));return `<option value="${m}">${label}</option>`}).join('');if(months.includes(selectedMonth))month.value=selectedMonth;const outlets=[...new Set(records.map(r=>r.outlet))].sort((a,b)=>a.localeCompare(b,'id'));outlet.innerHTML='<option value="">Semua outlet</option>'+outlets.map(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;return option.outerHTML}).join('');if(outlets.includes(selectedOutlet))outlet.value=selectedOutlet;}
function filtered(){const m=$('month').value,j=$('jenis').value,o=$('outlet').value;return records.filter(r=>(!m||monthKey(r.tanggal)===m)&&(j==='ALL'||r.jenis===j)&&(!o||r.outlet===o));}
function render(){const data=filtered();const sum=data.reduce((acc,r)=>acc+r.total,0);$('total').textContent=rupiah(sum);$('active').textContent=`${new Set(data.filter(r=>r.total>0).map(r=>r.outlet)).size} / ${new Set(records.map(r=>r.outlet)).size}`;$('count').textContent=new Intl.NumberFormat('id-ID').format(data.length);const body=$('rows');body.replaceChildren();for(const r of [...data].sort((a,b)=>b.tanggal-a.tanggal||a.outlet.localeCompare(b.outlet,'id'))){const offline=r.channels['DINE IN']+r.channels['TAKE AWAY'];const online=CHANNELS.slice(2).reduce((s,c)=>s+r.channels[c],0);const tr=document.createElement('tr');for(const [text,cls] of [[dateLabel(r.tanggal),''],[r.outlet,''],[r.jenis||'–',''],[rupiah(offline),'number'],[rupiah(online),'number'],[rupiah(r.total),'number']]){const td=document.createElement('td');td.textContent=text;if(cls)td.className=cls;tr.appendChild(td);}body.appendChild(tr);} $('empty').classList.toggle('hidden',data.length>0);$('footer').textContent=`Data diperbarui otomatis setiap ${REFRESH_INTERVAL_MS/1000} detik · ${new Date().toISOString()}`;}
$('refresh').addEventListener('click',loadData);for(const id of ['month','jenis','outlet'])$(id).addEventListener('change',render);loadData();setInterval(()=>{if(!document.hidden)loadData();},REFRESH_INTERVAL_MS);
</script>
</body>
</html>
