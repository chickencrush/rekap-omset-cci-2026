<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Omset CCI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef5;--tx:#0f1b2d;--mu:#56657b;--gl:rgba(255,255,255,.58);--bd:rgba(255,255,255,.8);--sh:0 10px 34px rgba(30,50,90,.13);--ac:#0b7a8a;--ac2:#2563eb;--ok:#15803d;--bad:#b91c1c;--wa:#b45309;--tr:rgba(15,27,45,.09);--o1:#7dd3d8;--o2:#a9b8f5}
[data-theme=dark]{--bg:#0a111e;--tx:#e8edf7;--mu:#97a4bb;--gl:rgba(22,32,52,.55);--bd:rgba(255,255,255,.1);--sh:0 10px 34px rgba(0,0,0,.45);--ac:#4fd1c5;--ac2:#7aa2ff;--ok:#4ade80;--bad:#f87171;--wa:#fbbf24;--tr:rgba(255,255,255,.09);--o1:#0f5c68;--o2:#27368f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 420px at 8% 6%,var(--o1),transparent 70%),radial-gradient(620px 520px at 95% 30%,var(--o2),transparent 70%);opacity:.55}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;margin:0}
.sub{color:var(--mu);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--gl);-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--sh);padding:18px;min-width:0}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:3fr 2fr}
@media(max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g21{grid-template-columns:1fr}}
@media(max-width:520px){.g4{grid-template-columns:1fr}.wrap{padding:14px 10px 40px}}
.sec-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
select,button{font:inherit;color:var(--tx);background:var(--gl);border:1px solid var(--bd);border-radius:12px;padding:7px 12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
select{box-shadow:inset 0 0 0 1px var(--tr)}
button{cursor:pointer;box-shadow:inset 0 0 0 1px var(--tr)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.seg{display:inline-flex;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--tr)}
.seg button{border:0;border-radius:0;box-shadow:none}
.seg button.on{background:var(--ac);color:#fff}
.kpi .l{color:var(--mu);font-size:13px}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:2px 0}
.kpi .n{font-size:12.5px;color:var(--mu)}
.up{color:var(--ok)}.dn{color:var(--bad)}
.banner{border-radius:16px;padding:12px 16px;margin-bottom:14px;border:1px solid var(--wa);background:var(--gl);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--tx)}
.banner b{color:var(--wa)}
.split{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--tr);margin:10px 0 8px}
.split i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mu)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--tr)}
th:first-child,td:first-child,th.t,td.t{text-align:left}
th{font-weight:600;color:var(--mu);font-size:12.5px}
tr:last-child td{border-bottom:0}
.bar{height:6px;border-radius:9px;background:var(--tr);min-width:70px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ac)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--tr);color:var(--mu)}
.mut{color:var(--mu)}
.donut{width:190px;height:190px;flex:none}
.dc1{font-size:13px;fill:var(--mu)}.dc2{font-size:15px;font-weight:700;fill:var(--tx)}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:260px}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--tr)}
.list li:last-child{border-bottom:0}
.ins{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ins li{padding:10px 14px;border-radius:14px;background:var(--tr);border-left:3px solid var(--ac)}
.ins li.warn{border-left-color:var(--wa)}.ins li.ok{border-left-color:var(--ok)}.ins li.bad{border-left-color:var(--bad)}
.empty{color:var(--mu);padding:14px 0}
.stat{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu)}
.stat i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.stat.err i{background:var(--bad)}
svg text{font-family:inherit}
@media(prefers-reduced-motion:no-preference){.bar i,.split i{transition:width .4s ease}}

:root{--hi:rgba(255,255,255,.65)}
[data-theme=dark]{--hi:rgba(255,255,255,.07)}
.card{border-radius:26px;padding:20px;box-shadow:var(--sh),inset 0 1px 0 var(--hi)}
.top{position:sticky;top:8px;z-index:20;margin-bottom:16px;padding:10px 16px;border-radius:24px;background:var(--gl);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--bd);box-shadow:var(--sh),inset 0 1px 0 var(--hi)}
select{border-radius:99px;padding:7px 14px}
.seg{border-radius:99px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:50%}
#prog{position:fixed;left:0;top:0;height:3px;width:100%;z-index:50;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,var(--ac),var(--ac2),transparent) no-repeat;background-size:45% 100%;animation:slide 1.1s linear infinite}
body.loading #prog{opacity:1}
body.loading #refresh .ico{animation:spin .8s linear infinite}
@keyframes slide{from{background-position:-60% 0}to{background-position:160% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
.sk{min-height:130px;background:linear-gradient(100deg,var(--gl) 30%,var(--tr) 50%,var(--gl) 70%);background-size:200% 100%;animation:shim 1.4s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.kpi{position:relative;overflow:hidden;padding-bottom:50px}
.kpi .v{font-size:27px}
.spark{position:absolute;left:0;right:0;bottom:0;width:100%;height:38px}
.kpi .bar{position:absolute;left:20px;right:20px;bottom:18px}
.mb{margin-bottom:14px}
.ov{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:26px}
@media(max-width:860px){.ov{grid-template-columns:1fr}}
.chart{width:100%;height:100%;min-height:280px;display:block}
.ax{stroke:var(--tr);stroke-width:1}
.hl{fill:var(--tr);opacity:0}.hl.on{opacity:1}
.hit{fill:transparent;cursor:pointer}
.dd{margin-top:16px;padding:14px 16px;border-radius:18px;background:var(--tr)}
.dd-h{font-weight:600;color:var(--mu);font-size:13px}
.dd-v{font-size:22px;font-weight:800;margin:2px 0 6px}
.ins{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.bar i{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.rk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:700;background:var(--tr)}
.rk.r1,.rk.r2,.rk.r3{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.donut{width:220px;height:220px}
.sl{cursor:pointer;transition:stroke-width .2s,opacity .2s}
.sl.on{stroke-width:30}
[data-i].off{opacity:.35}
tr[data-i]{cursor:pointer}
tr[data-i].on td{background:var(--tr)}
.dc3{font-size:12px;fill:var(--mu)}
#tip{position:fixed;z-index:60;pointer-events:none;padding:8px 12px;border-radius:12px;font-size:13px;background:var(--tx);color:var(--bg);box-shadow:var(--sh)}
#tip[hidden]{display:none}

html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
.rk-h{font-weight:700;margin:16px 0 4px}
.rk-h:first-child{margin-top:0}

.card:not(.sk):hover{border-color:var(--ac);box-shadow:0 18px 48px rgba(11,122,138,.2),inset 0 1px 0 var(--hi)}
.hl{transition:opacity .15s}
.bar i{transition:width .5s cubic-bezier(.22,1,.36,1)}

.per{display:inline-flex;align-items:center;gap:7px;margin:8px 0 2px;padding:5px 13px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 4px 14px rgba(37,99,235,.25)}
.per .ico{width:14px;height:14px}
.xp{display:inline-grid;place-items:center;width:24px;height:24px;padding:0;margin-right:8px;border-radius:50%;vertical-align:middle}
.chev{width:14px;height:14px;transition:transform .25s}
.xp[aria-expanded=true] .chev{transform:rotate(180deg)}
.dt td{background:var(--tr);padding:14px}
.dtg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 22px;white-space:normal}
.dth{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:5px}

@media(max-width:720px){.card{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}}
.tabs{display:flex;max-width:100%;overflow-x:auto;margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;transition:background-color .25s,color .25s}
.wk{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
@media(max-width:860px){.wk{grid-template-columns:1fr}}
.wc{padding:16px 18px;border-radius:20px;background:var(--tr)}
.wc .big{font-size:28px;margin:4px 0}
.wg{text-align:center;padding:4px 10px}
.wg .big{font-size:30px}
.wt{margin-top:18px}
.wt .bar2{display:grid;gap:3px;min-width:120px}
.wt .bar2 i{display:block;height:6px;border-radius:9px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.tcl{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.tcl li{display:flex;gap:12px;align-items:flex-start}
.tcl .grow{flex:1;min-width:0}
</style>
</head>
<body>
<div class="wrap">
<div id="prog"></div>
<header class="top">
  <div>
    <h1>Omset Chicken Crush Indonesia</h1>
    <div class="sub" id="periode">Memuat data…</div>
  </div>
  <div class="tools">
    <span class="stat" id="stat"><i></i><span>Menghubungkan…</span></span>
    <button id="refresh" class="ib" type="button" aria-label="Muat ulang data" title="Muat ulang"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
    <button id="theme" class="ib" type="button" aria-label="Ganti tema"><svg class="ico" viewBox="0 0 24 24"></svg></button>
  </div>
</header>

<div id="banner"></div>
<div class="grid g4" id="kpi"><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div><div class="card sk"></div></div>

<section class="card mb">
  <div class="sec-h"><h2>Total Sales Weekly</h2><select id="selWk" aria-label="Kelompok outlet"><option value="ALL">Semua</option><option value="PUSAT">Pusat</option><option value="MITRA">Mitra</option></select></div>
  <div id="wk"></div>
</section>

<section class="card" style="margin-bottom:14px">
  <div class="sec-h"><h2>Penjualan per kategori</h2>
    <select id="selKat" aria-label="Kelompok outlet"><option value="ALL">Semua outlet</option><option value="PUSAT">Pusat</option><option value="MITRA">Mitra</option></select></div>
  <div id="kat"></div>
</section>

<section class="card mb">
  <div class="sec-h"><h2>TOP KATEGORI PENJUALAN</h2>
    <select id="selTk" aria-label="Kelompok outlet"><option value="ALL">Semua</option><option value="PUSAT">Pusat</option><option value="MITRA">Mitra</option></select></div>
  <div id="tk"></div>
</section>

<section class="card" style="margin-bottom:14px">
  <div class="sec-h"><h2>Ranking outlet</h2>
    <select id="selRank" aria-label="Kelompok outlet"><option value="ALL">Semua</option><option value="PUSAT">Pusat</option><option value="MITRA">Mitra</option></select></div>
  <div id="rank"></div>
</section>

<section class="card mb">
  <div class="sec-h"><h2>Perbandingan per outlet</h2><div class="tools">
    <select id="selOc" aria-label="Kelompok outlet"><option value="ALL">Semua</option><option value="PUSAT">Pusat</option><option value="MITRA">Mitra</option></select>
    <select id="selOs" aria-label="Urutan"><option value="omset">Urut omset</option><option value="pct">Urut growth</option></select></div></div>
  <div id="oc"></div>
</section>

<div class="grid g2" style="grid-template-columns:1fr">
  <!-- Penjualan menu disembunyikan sementara. Hapus atribut hidden di bawah untuk menampilkan lagi, dan hapus style pada grid ini. -->
  <section class="card" hidden>
    <div class="sec-h"><h2>Menu tertinggi dan terendah</h2>
      <div class="tools"><select id="selMW" aria-label="Wilayah"></select>
      <select id="selMK" aria-label="Kategori menu"><option>Makanan</option><option>Minuman</option></select>
      <div class="seg" role="group" aria-label="Urutkan menu"><button type="button" data-m="qty" class="on">Qty</button><button type="button" data-m="val">Nilai</button></div></div></div>
    <div id="menu"></div>
  </section>
</div>
<section class="card">
  <div class="sec-h"><h2>ANALISA</h2></div>
  <ul class="ins" id="ins"></ul>
</section>
</div>

<div id="tip" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxQ1MAD0eQ3PHosbEjW_k1F6zImJQKwtNJVTKPuqOVKMYSZguxFgFUMqd3WpIaBgZCE/exec';
const TOKEN = '';
const REFRESH_MS = 600000;

const K = ['Dine In', 'Take Away', 'ESB Order', 'GoFood', 'GrabFood', 'ShopeeFood'];
const KC = ['#3b82f6', '#06b6d4', '#8b5cf6', '#ef4444', '#22c55e', '#f97316'];
const OFFLINE = [0, 1];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
const jt = n => n >= 1e9 ? (n / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' M' : n >= 1e6 ? (n / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt' : Math.round(n).toLocaleString('id-ID');
const pf = (x, d = 1) => x.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const sum = a => a.reduce((x, y) => x + y, 0);
const share = (a, b) => b ? a / b * 100 : 0;
const MON = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const sign = x => (x > 0 ? '+' : '') + pf(x);

let D = null, raw = '';
const S = { kat: 'ALL', rank: 'ALL', menu: 'qty', oc: 'ALL', os: 'omset', mw: '', mk: 'Makanan', open: new Set(), wk: 'ALL', tk: 'ALL' };

/* ---------- data ---------- */
function prep(r) {
  const jOf = {};
  r.outlets.forEach(o => { jOf[o.n] = o.j; });
  const mk = x => ({ d: x[0], day: +x[0].slice(8), o: x[1], j: jOf[x[1]] || 'MITRA', v: x.slice(2).filter((_, i) => i !== 3), t: sum(x.slice(2)) });
  const rows = r.rows.map(mk).filter(x => x.t > 0);
  const [Y, M] = r.bulan.slice(0, 7).split('-').map(Number);
  const pd = new Date(Y, M - 2, 1);
  const pym = pd.getFullYear() + '-' + String(pd.getMonth() + 1).padStart(2, '0');
  const arsip = r.arsip.map(mk).filter(x => x.d.slice(0, 7) === pym && x.t > 0);
  const dim = new Date(Y, M, 0).getDate(), pdim = new Date(Y, M - 1, 0).getDate();

  const by = {};
  rows.forEach(x => { (by[x.day] = by[x.day] || new Set()).add(x.o); });
  const days = Object.keys(by).map(Number);
  const N = days.length ? Math.max(...days) : 0;
  const mx = days.length ? Math.max(...days.map(d => by[d].size)) : 0;
  let C = 0;
  days.forEach(d => { if (by[d].size >= 0.9 * mx && d > C) C = d; });

  const os = r.outlets.map(o => {
    const rs = rows.filter(x => x.o === o.n);
    return {
      ...o, t: sum(rs.map(x => x.t)), dd: rs.length, last: rs.length ? Math.max(...rs.map(x => x.day)) : 0,
      tg: r.target[o.n] || 0, prev: r.prev[o.n] || 0, v: K.map((_, i) => sum(rs.map(x => x.v[i])))
    };
  });
  os.forEach(o => { o.avg = o.dd ? o.t / o.dd : 0; });
  return { ...r, Y, M, pym, dim, pdim, rows, arsip, N, C, os, total: sum(os.map(o => o.t)) };
}
const grp = (list, j) => j === 'ALL' ? list : list.filter(x => x.j === j);
const chan = rs => K.map((_, i) => sum(rs.map(x => x.v[i])));

/* ---------- gerak ---------- */
const M = window.Motion, REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches, MOTION = !!M && !REDUCE;
let revealed = false;
function reveal() {
  if (revealed || !MOTION) return;
  revealed = true;
  document.querySelectorAll('.card:not(.sk)').forEach((c, i) => {
    c.style.opacity = 0;
    M.inView(c, () => {
      M.animate(c, { opacity: [0, 1], y: [28, 0] }, { duration: .7, delay: (i % 4) * .07, ease: [.22, 1, .36, 1] })
        .finished.then(() => { c.style.opacity = ''; c.style.transform = ''; });
    }, { amount: .1 });
  });
}
function pop(root) {
  if (MOTION) M.animate(`${root} tbody tr, ${root} .list li, ${root} .tcl li`, { opacity: [0, 1], y: [10, 0] }, { duration: .4, delay: M.stagger(.025) });
}
if (window.Lenis && !REDUCE) {
  const lenis = new Lenis({ lerp: .08 });
  const raf = t => { lenis.raf(t); requestAnimationFrame(raf); };
  requestAnimationFrame(raf);
}

/* ---------- komponen ---------- */
function tip(e, html) {
  const t = $('#tip');
  if (!e) { t.hidden = true; return; }
  t.innerHTML = html; t.hidden = false;
  t.style.left = Math.max(8, Math.min(e.clientX + 14, innerWidth - t.offsetWidth - 8)) + 'px';
  t.style.top = Math.max(8, e.clientY - 48) + 'px';
}
function donut(items, label) {
  const R = 68, Cc = 2 * Math.PI * R, tot = sum(items.map(i => i.v));
  let off = 0;
  const arcs = items.map((i, n) => {
    if (i.v <= 0) return '';
    const l = i.v / tot * Cc;
    const c = `<circle class="sl" data-i="${n}" tabindex="0" r="${R}" cx="90" cy="90" fill="none" stroke="${i.c}" stroke-width="24" stroke-dasharray="${l} ${Cc - l}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;
    off += l;
    return c;
  }).join('');
  return `<svg viewBox="0 0 180 180" class="donut" role="img" aria-label="${esc(label)}"><circle r="${R}" cx="90" cy="90" fill="none" stroke="var(--tr)" stroke-width="24"/>${arcs}<text x="90" y="82" text-anchor="middle" class="dc1"></text><text x="90" y="102" text-anchor="middle" class="dc2"></text><text x="90" y="120" text-anchor="middle" class="dc3"></text></svg>`;
}
function bindDonut(root, items, dflt) {
  const el = $(root), tot = sum(items.map(i => i.v));
  let pin = -1;
  const set = i => {
    const it = items[i];
    el.querySelector('.dc1').textContent = it ? it.l : dflt[0];
    el.querySelector('.dc2').textContent = it ? jt(it.v) : dflt[1];

    el.querySelectorAll('[data-i]').forEach(n => {
      const on = +n.dataset.i === i;
      n.classList.toggle('on', on);
      n.classList.toggle('off', i >= 0 && !on);
    });
  };
  el.querySelectorAll('[data-i]').forEach(n => {
    const i = +n.dataset.i, it = items[i];
    n.onmouseenter = n.onfocus = () => set(i);
    n.onmouseleave = n.onblur = () => { set(pin); tip(null); };
    n.onclick = () => { pin = pin === i ? -1 : i; set(pin); };
    n.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); n.onclick(); } };
    if (n.tagName === 'circle') n.onpointermove = e => tip(e, `<b>${esc(it.l)}</b><br>${rp(it.v)} · ${pf(share(it.v, tot))}`);
  });
  set(-1);
}
const arrow = x => `<span class="${x >= 0 ? 'up' : 'dn'}">${x >= 0 ? '▲' : '▼'} ${sign(x)}</span>`;

const spark = (a, c) => {
  if (a.length < 2) return '';
  const mx = Math.max(...a, 1), w = 100, h = 34;
  const pts = a.map((v, i) => `${i / (a.length - 1) * w},${h - v / mx * (h - 4) - 1}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${h} ${pts} ${w},${h}" fill="${c}" opacity=".18"/><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>`;
};
const series = j => Array.from({ length: D.N }, (_, i) => sum(grp(D.rows, j).filter(x => x.day === i + 1).map(x => x.t)));
const CAL = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>';
function periode(rs) {
  if (!rs.length) return 'Belum ada data';
  const d = rs.map(x => x.day), a = Math.min(...d), b = Math.max(...d);
  return `Periode ${a === b ? a : a + '–' + b} ${MON[D.M - 1]} ${D.Y}`;
}
function kpi() {
  const P = grp(D.rows, 'PUSAT'), Mi = grp(D.rows, 'MITRA');
  const p = sum(grp(D.os, 'PUSAT').map(o => o.t)), m = sum(grp(D.os, 'MITRA').map(o => o.t));
  const avg = D.N ? D.total / D.N : 0;
  const nP = grp(D.os, 'PUSAT').length, nM = grp(D.os, 'MITRA').length;
  const c = [
    ['Total omset', periode(D.rows), rp(D.total), `Rata-rata ${rp(avg)} per hari`, spark(series('ALL'), 'var(--ac)')],
    ['Omset pusat', periode(P), rp(p), `${pf(share(p, D.total))} dari total · ${nP} outlet`, spark(series('PUSAT'), 'var(--ac)')],
    ['Omset mitra', periode(Mi), rp(m), `${pf(share(m, D.total))} dari total · ${nM} outlet`, spark(series('MITRA'), 'var(--ac2)')],
    ['Proyeksi akhir bulan', `Hari ke-${D.N} dari ${D.dim}`, rp(avg * D.dim), `Rata-rata per hari × ${D.dim} hari`, `<div class="bar" title="Hari berjalan"><i style="width:${share(D.N, D.dim)}%"></i></div>`]
  ];
  $('#kpi').innerHTML = c.map(x => `<div class="card kpi"><div class="l">${x[0]}</div><div class="per">${CAL}${x[1]}</div><div class="v">${x[2]}</div><div class="n">${x[3]}</div>${x[4]}</div>`).join('');
}

const WK = [[1, 7], [8, 14]];
const CATS = [{ n: 'Offline', ch: [0, 1] }, { n: 'ESB Order', ch: [2] }, { n: 'GoFood', ch: [3] }, { n: 'GrabFood', ch: [4] }, { n: 'ShopeeFood', ch: [5] }];
const inW = (x, w) => x.day >= WK[w][0] && x.day <= WK[w][1];
const gro = (a, b) => b ? share(a - b, b) : null;
const gtag = g => g === null ? '<span class="mut">–</span>' : arrow(g);

function wk() {
  const G = grp(D.rows, S.wk);
  const W = WK.map((r, w) => {
    const rs = G.filter(x => inW(x, w)), t = sum(rs.map(x => x.t)), ds = new Set(rs.map(x => x.day)).size;
    return { w, t, ds, avg: ds ? t / ds : 0, p: sum(rs.filter(x => x.j === 'PUSAT').map(x => x.t)), v: chan(rs), part: WK[w][1] > D.C };
  });
  const card = x => `<div class="wc"><div class="mut">Week ${x.w + 1} · tanggal ${WK[x.w][0]}–${WK[x.w][1]}${x.part && x.ds ? ' <span class="tag">data belum lengkap</span>' : ''}</div>
    <div class="big">${x.ds ? rp(x.t) : 'Belum ada data'}</div>
    ${x.ds ? `<div class="sub">Rata-rata ${rp(x.avg)} per hari · ${x.ds} hari data</div>${S.wk === 'ALL' ? `<div class="sub">Pusat ${rp(x.p)} · Mitra ${rp(x.t - x.p)}</div>` : ''}` : ''}</div>`;
  const g = gro(W[1].t, W[0].t), diff = W[1].t - W[0].t;
  const items = [['Total', W[0].t, W[1].t]]

  <div class="scroll wt"><table><thead><tr><th>Perbandingan</th><th>Week 1</th><th>Week 2</th><th>Selisih</th><th>Growth</th><th class="t"> </th></tr></thead><tbody>${items.map(([n, a, b]) => { const m = Math.max(a, b, 1); return `<tr><td>${n}</td><td>${rp(a)}</td><td>${rp(b)}</td><td><span class="${b - a >= 0 ? 'up' : 'dn'}">${b - a >= 0 ? '+' : '-'}${rp(Math.abs(b - a))}</span></td><td>${gtag(gro(b, a))}</td><td class="t"><div class="bar2"><i style="width:${a / m * 100}%;background:var(--ac)"></i><i style="width:${b / m * 100}%;background:var(--ac2)"></i></div></td></tr>`; }).join('')}</tbody></table></div>
  <div class="leg" style="margin-top:8px"><span><span class="dot" style="background:var(--ac)"></span>Week 1</span><span><span class="dot" style="background:var(--ac2)"></span>Week 2</span></div>`;
  pop('#wk');
}

function rank() {

  const notes = [none ? `${none} outlet belum ada data dan tidak ikut peringkat.` : '', hasMitraTarget ? '' : 'Target mitra belum diisi. Isi di tab TARGET MITRA pada spreadsheet.'].filter(Boolean);

    + notes.map(n => `<div class="sub" style="margin-top:8px">${n}</div>`).join('');

function compare(j) {
  const cur = grp(D.rows, j).filter(x => x.day <= D.C), cv = chan(cur), ct = sum(cv);
  const pr = grp(D.arsip, j).filter(x => x.day <= D.C);
  if (pr.length) { const pv = chan(pr); return { mode: 'arsip', ct, pt: sum(pv), cv, pv }; }
  let base = 0;
  if (j === 'ALL') base = D.prevTotal;
  else if (j === 'PUSAT') base = sum(grp(D.os, 'PUSAT').map(o => o.prev));
  return base > 0 ? { mode: 'est', ct, pt: base / D.pdim * D.C, cv, base } : { mode: 'none', ct, cv };
}

function oc() {
  const rows = grp(D.os, S.oc).filter(o => o.dd > 0).map(o => {
    const pr = D.arsip.filter(x => x.o === o.n && x.day <= o.last);
    let prev = null, basis = '';
    if (pr.length) { prev = sum(pr.map(x => x.t)); basis = 'Arsip'; }
    else if (o.prev > 0) { prev = o.prev / D.pdim * o.last; basis = 'Estimasi'; }
    return { o, prev, basis, diff: prev === null ? null : o.t - prev, pct: prev ? share(o.t - prev, prev) : null };
  });
  rows.sort(S.os === 'pct' ? (a, b) => (b.pct ?? -1e9) - (a.pct ?? -1e9) : (a, b) => b.o.t - a.o.t);
  if (!rows.length) { $('#oc').innerHTML = '<div class="empty">Belum ada outlet dengan data pada kelompok ini.</div>'; return; }
  const ok = rows.filter(r => r.pct !== null), up = ok.filter(r => r.pct >= 0).length;
  const est = rows.some(r => r.basis === 'Estimasi');
  $('#oc').innerHTML = `<div class="sub" style="margin-bottom:8px">${up} outlet naik, ${ok.length - up} turun, ${rows.length - ok.length} belum punya pembanding bulan lalu. Rentang dibandingkan: tanggal 1 sampai tanggal input terakhir tiap outlet.</div>
  <div class="scroll"><table><thead><tr><th class="t">Outlet</th><th>Data sampai</th><th>Bulan ini</th><th>Bulan lalu (periode sama)</th><th>Selisih</th><th>Growth</th><th>Dasar</th></tr></thead><tbody>${rows.map(r => `<tr><td class="t">${esc(r.o.n)} <span class="tag">${r.o.j === 'PUSAT' ? 'Pusat' : 'Mitra'}</span></td><td>${r.o.last} ${MON[D.M - 1].slice(0, 3)}</td><td>${rp(r.o.t)}</td><td>${r.prev === null ? '–' : rp(r.prev)}</td><td>${r.diff === null ? '–' : `<span class="${r.diff >= 0 ? 'up' : 'dn'}">${r.diff >= 0 ? '+' : '-'}${rp(Math.abs(r.diff))}</span>`}</td><td>${r.pct === null ? '–' : arrow(r.pct)}</td><td class="mut">${r.basis || '–'}</td></tr>`).join('')}</tbody></table></div>
  <div class="sub" style="margin-top:8px">${est ? 'Estimasi = omset bulan lalu ÷ jumlah hari bulan lalu × jumlah hari data. ' : ''}${ok.length < rows.length ? 'Isi OMSET BLN LALU (kolom AJ di INPUT OMSET) atau arsipkan bulan lalu agar semua outlet punya pembanding.' : ''}</div>`;
  pop('#oc');
}

function analisa() {
  const L = [], d = D, avg = d.N ? d.total / d.N : 0;
  const P = grp(d.os, 'PUSAT'), Mi = grp(d.os, 'MITRA'), p = sum(P.map(o => o.t));
  L.push({ k: 'info', t: `Total omset <b>${rp(d.total)}</b> sampai tanggal ${d.N}. Pusat ${pf(share(p, d.total))}, mitra ${pf(share(d.total - p, d.total))}.` });
  const v = chan(d.rows), idx = v.map((x, i) => i).sort((a, b) => v[b] - v[a]), off = sum(OFFLINE.map(i => v[i]));
  L.push({ k: 'info', t: `<b>${K[idx[0]]}</b> kanal terbesar (${pf(share(v[idx[0]], d.total))}), disusul ${K[idx[1]]} (${pf(share(v[idx[1]], d.total))}). Offline ${pf(share(off, d.total))}, online dan delivery ${pf(share(d.total - off, d.total))}.` });
  const top = d.os.slice().sort((a, b) => b.t - a.t).slice(0, 3);
  L.push({ k: 'info', t: `Tiga outlet teratas: ${top.map(o => `${esc(o.n)} (${pf(share(o.t, d.total))})`).join(', ')}, bersama ${pf(share(sum(top.map(o => o.t)), d.total))} dari total.` });
  const dt = {};
  d.rows.filter(x => x.day <= d.C).forEach(x => { dt[x.day] = (dt[x.day] || 0) + x.t; });
  const ks = Object.keys(dt).map(Number);
  if (ks.length > 2) {
    const hi = ks.reduce((a, b) => dt[a] >= dt[b] ? a : b), lo = ks.reduce((a, b) => dt[a] <= dt[b] ? a : b);
    const we = ks.filter(k => [0, 6].includes(new Date(d.Y, d.M - 1, k).getDay())), wd = ks.filter(k => !we.includes(k));
    let t = `Dari tanggal 1–${d.C}, omset harian tertinggi tanggal ${hi} (${rp(dt[hi])}) dan terendah tanggal ${lo} (${rp(dt[lo])}).`;
    if (we.length && wd.length) { const a = sum(we.map(k => dt[k])) / we.length, b = sum(wd.map(k => dt[k])) / wd.length; t += ` Rata-rata akhir pekan ${rp(a)}, hari kerja ${rp(b)} (${sign(share(a - b, b))}).`; }
    L.push({ k: 'info', t });
  }
  const c = compare('ALL');
  if (c.mode !== 'none') L.push({ k: c.ct >= c.pt ? 'ok' : 'bad', t: `Dibanding bulan lalu pada tanggal 1–${d.C}: ${sign(share(c.ct - c.pt, c.pt))} (${rp(c.ct)} vs ${rp(c.pt)}${c.mode === 'est' ? ', estimasi' : ''}).` });
  const left = d.dim - d.N;
  [['Pusat', P], ['Mitra', Mi]].forEach(([n, g]) => {
    const tg = g.filter(o => o.tg > 0), T = sum(tg.map(o => o.tg)), R = sum(tg.map(o => o.t));
    if (!T) return;
    const need = Math.max(T - R, 0);
    L.push({ k: R >= T ? 'ok' : 'info', t: `Target ${n} (${tg.length} outlet terisi): ${rp(R)} dari ${rp(T)} (${pf(share(R, T))}).` + (R < T && left > 0 ? ` Butuh ${rp(need / left)} per hari selama ${left} hari tersisa.` : '') });
  });
  return L;
}

let busy = false;
async function load() {
  if (API_URL.indexOf('http') !== 0) { stat(false, 'URL web app belum diisi di index.html'); return; }
  if (busy) return;
  busy = true;
  const t0 = Date.now();
  document.body.classList.add('loading');
  try {
    const q = (TOKEN ? 'token=' + encodeURIComponent(TOKEN) + '&' : '') + 't=' + Date.now();
    const res = await fetch(API_URL + (API_URL.includes('?') ? '&' : '?') + q);
    const txt = await res.text();
    if (txt !== raw) {
      const j = JSON.parse(txt);
      if (j.error) throw new Error(j.error);
      D = prep(j); raw = txt; render();
    }
    stat(true);
  } catch (e) {
    stat(false, 'Gagal memuat: ' + e.message);
  } finally {
    busy = false;
    setTimeout(() => document.body.classList.remove('loading'), Math.max(0, 800 - (Date.now() - t0)));
  }
}

/* ---------- interaksi ---------- */
const safe = f => { try { return f(); } catch (e) { return null; } };
const ICON = {
  light: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  dark: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
};
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  $('#theme svg').innerHTML = ICON[t];
  $('#theme').title = t === 'dark' ? 'Mode cerah' : 'Mode gelap';
  safe(() => localStorage.setItem('theme', t));
}
setTheme(safe(() => localStorage.getItem('theme')) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
$('#refresh').onclick = load;
$('#selKat').onchange = e => { S.kat = e.target.value; if (D) kat(); };
$('#selRank').onchange = e => { S.rank = e.target.value; if (D) rank(); };
$('#rank').addEventListener('click', e => {
  const b = e.target.closest('.xp');
  if (!b) return;
  const n = b.dataset.o, dt = b.closest('tr').nextElementSibling, open = !S.open.has(n);
  if (open) S.open.add(n); else S.open.delete(n);
  b.setAttribute('aria-expanded', open);
  dt.hidden = !open;
  if (open && MOTION) M.animate(dt.firstChild.firstChild, { opacity: [0, 1], y: [-6, 0] }, { duration: .3 });
});
$('#selWk').onchange = e => { S.wk = e.target.value; if (D) wk(); };
$('#selTk').onchange = e => { S.tk = e.target.value; if (D) tk(); };
$('#selOc').onchange = e => { S.oc = e.target.value; if (D) oc(); };
$('#selOs').onchange = e => { S.os = e.target.value; if (D) oc(); };
$('#selMW').onchange = e => { S.mw = e.target.value; if (D) menu(); };
$('#selMK').onchange = e => { S.mk = e.target.value; if (D) menu(); };
document.querySelectorAll('[data-m]').forEach(b => { b.onclick = () => { S.menu = b.dataset.m; if (D) menu(); }; });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, REFRESH_MS);
load();
</script>
